  <script>self.__next_f.push([1, "\n\u003ch2 class=\"wp-block-heading\"\u003e\u003cstrong\u003eArquitectura\u003c/strong\u003e\u003c/h2\u003e\n\n\n\n\u003cpre class=\"wp-block-code\"\u003e\u003ccode\u003eWordPress CMS → REST API → Next.js Frontend\n                           ├── Server Components\n                           ├── Client Components\n                           ├── SWR Cache\n                           └── Zustand Store\u003c/code\u003e\u003c/pre\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003e\u003cstrong\u003eTecnologías Utilizadas\u003c/strong\u003e\u003c/h2\u003e\n\n\n\n\u003cp\u003eEste proyecto es una solución \u003cstrong\u003eheadless\u003c/strong\u003e que combina la potencia de \u003cstrong\u003eWordPress como CMS\u003c/strong\u003e con el rendimiento de \u003cstrong\u003eNext.js como frontend\u003c/strong\u003e. A continuación, explico cada tecnología utilizada y por qué fue elegida.\u003c/p\u003e\n\n\n\n\u003cdiv style=\"height:27px\" aria-hidden=\"true\" class=\"wp-block-spacer\"\u003e\u003c/div\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003e\u003cstrong\u003e1. Next.js 14.2 ▲\u003c/strong\u003e\u003c/h2\u003e\n\n\n\n\u003cp\u003eFramework principal de React para producción. Next.js es el motor de este proyecto. La versión 14.2 ofrece características avanzadas como:\u003c/p\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003e\u003cstrong\u003eApp Router\u003c/strong\u003e: Sistema de enrutamiento moderno basado en la estructura de archivos\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eServer Components\u003c/strong\u003e: Componentes que se ejecutan en el servidor, reduciendo el JavaScript del cliente\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eISR (Incremental Static Regeneration)\u003c/strong\u003e: Regeneración estática incremental para actualizaciones sin rebuild\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eSEO optimizado\u003c/strong\u003e: Meta tags dinámicas, Open Graph, y JSON-LD automática\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003cp\u003e\u003cstrong\u003eVentajas\u003c/strong\u003e: Rendimiento superior, Core Web Vitals optimizados, y mejor SEO.\u003c/p\u003e\n\n\n\n\u003cdiv style=\"height:60px\" aria-hidden=\"true\" class=\"wp-block-spacer\"\u003e\u003c/div\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003e\u003cstrong\u003e2. React 18\u003c/strong\u003e ⚛️\u003c/h2\u003e\n\n\n\n\u003cp\u003eBiblioteca de interfaces de usuario. React 18 introduce características revolucionarias:\u003c/p\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003e\u003cstrong\u003eServer Components\u003c/strong\u003e: ejecución en servidor sin JavaScript adicional\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eConcurrent Rendering\u003c/strong\u003e: renderizado concurrente para interfaces más responsivas\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eAutomatic Batching\u003c/strong\u003e: agrupación automática de actualizaciones de estado\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eSuspense\u003c/strong\u003e: carga progresiva de componentes\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003cdiv style=\"height:60px\" aria-hidden=\"true\" class=\"wp-block-spacer\"\u003e\u003c/div\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003e\u003cstrong\u003e3. TypeScript 5\u003c/strong\u003e\u003c/h2\u003e\n\n\n\n\u003cp\u003eTipado estático para JavaScript. TypeScript añade seguridad y mantenibilidad al código:\u003c/p\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003e\u003cstrong\u003eType Safety\u003c/strong\u003e: errores detectados en tiempo de compilación\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eAutocompletado\u003c/strong\u003e: mejor experiencia de desarrollo\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eRefactoring seguro\u003c/strong\u003e: cambios sin romper funcionalidad\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eDocumentación viva\u003c/strong\u003e: los tipos documentan el código\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003cpre class=\"wp-block-code\"\u003e\u003ccode\u003e// Ejemplo de tipo para Posts de WordPress\ninterface WPPost {\n  id: number;\n  title: { rendered: string };\n  content: { rendered: string };\n  slug: string;\n  featured_media: number;\n}\n\u003c/code\u003e\u003c/pre\u003e\n\n\n\n\u003cdiv style=\"height:60px\" aria-hidden=\"true\" class=\"wp-block-spacer\"\u003e\u003c/div\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003e\u003cstrong\u003e4. WordPress REST API\u003c/strong\u003e\u003c/h2\u003e\n\n\n\n\u003cp\u003eBackend de gestión de contenido. WordPress funciona como headless CMS, exponiendo datos via REST API:\u003c/p\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003e\u003cstrong\u003eCustom Post Types\u003c/strong\u003e: Soporte completo para tipos de contenido personalizados\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eEndpoints nativos\u003c/strong\u003e: \u003ccode\u003e/wp-json/wp/v2/posts\u003c/code\u003e, \u003ccode\u003e/wp-json/wp/v2/pages\u003c/code\u003e\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eMenús dinámicos\u003c/strong\u003e: \u003ccode\u003e/wp-json/wp/v2/menus\u003c/code\u003e\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eTaxonomías\u003c/strong\u003e: Categorías y etiquetas via API\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003cdiv style=\"height:60px\" aria-hidden=\"true\" class=\"wp-block-spacer\"\u003e\u003c/div\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003e\u003cstrong\u003e5. Sass/SCSS con ITCSS\u003c/strong\u003e\u003c/h2\u003e\n\n\n\n\u003cp\u003ePreprocesador CSS con arquitectura escalable. Sass permite escribir CSS más mantenible:\u003c/p\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003e\u003cstrong\u003eVariables\u003c/strong\u003e: colores, fuentes, espaciados reutilizables\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eMixins\u003c/strong\u003e: fragmentos de código reutilizables\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eNesting\u003c/strong\u003e: anidación natural de selectores\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eITCSS\u003c/strong\u003e: arquitectura inverted-triangle para CSS escalable\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003cp\u003e\u003cstrong\u003eEjemplo ITCSS\u003c/strong\u003e\u003c/p\u003e\n\n\n\n\u003col class=\"wp-block-list\"\u003e\n\u003cli\u003eSettings (variables)\u003c/li\u003e\n\n\n\n\u003cli\u003eTools (mixins)\u003c/li\u003e\n\n\n\n\u003cli\u003eGeneric (reset)\u003c/li\u003e\n\n\n\n\u003cli\u003eElements (tags)\u003c/li\u003e\n\n\n\n\u003cli\u003eObjects (layout)\u003c/li\u003e\n\n\n\n\u003cli\u003eComponents (UI)\u003c/li\u003e\n\n\n\n\u003cli\u003eUtilities (helpers)\u003c/li\u003e\n\u003c/ol\u003e\n\n\n\n\u003cdiv style=\"height:60px\" aria-hidden=\"true\" class=\"wp-block-spacer\"\u003e\u003c/div\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003e\u003cstrong\u003e6. Zustand\u003c/strong\u003e\u003c/h2\u003e\n\n\n\n\u003cp\u003eGestor de estado ligero. Zustand ofrece una alternativa simple a Redux:\u003c/p\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003e\u003cstrong\u003eMiddleware\u003c/strong\u003e: persistencia, devtools, y más\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eSin boilerplate\u003c/strong\u003e: configuración mínima\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eTypeScript nativo\u003c/strong\u003e: tipado completo\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eRenderizado optimizado\u003c/strong\u003e: solo re-renderiza componentes necesarios\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003cpre class=\"wp-block-code\"\u003e\u003ccode\u003econst useStore = create\u003cappstate\u003e((set) =\u003e ({\n  isMenuOpen: false,\n  toggleMenu: () =\u003e set((state) =\u003e ({ isMenuOpen: !state.isMenuOpen })),\n}));\u003c/appstate\u003e\u003c/code\u003e\u003c/pre\u003e\n\n\n\n\u003cdiv style=\"height:60px\" aria-hidden=\"true\" class=\"wp-block-spacer\"\u003e\u003c/div\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003e\u003cstrong\u003e7. Framer Motion\u003c/strong\u003e\u003c/h2\u003e\n\n\n\n\u003cp\u003eAnimaciones de producción. Framer Motion garantiza animaciones fluidas a 60fps:\u003c/p\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003e\u003cstrong\u003eExit Animations\u003c/strong\u003e: transiciones de salida\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eDeclarativo\u003c/strong\u003e: define animaciones como props\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eGestures\u003c/strong\u003e: soporte para hover, tap, drag\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eLayout Animations\u003c/strong\u003e: animaciones automáticas de posición\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003cpre class=\"wp-block-code\"\u003e\u003ccode\u003e\u003cmotion.div initial=\"{{\" opacity:=\"\" 0=\"\" }}=\"\" animate=\"{{\" 1=\"\"\u003e\n  {/* contenido */}\n\u003c/motion.div\u003e\u003c/code\u003e\u003c/pre\u003e\n\n\n\n\u003cdiv style=\"height:60px\" aria-hidden=\"true\" class=\"wp-block-spacer\"\u003e\u003c/div\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003e\u003cstrong\u003e8. Swiper.js\u003c/strong\u003e\u003c/h2\u003e\n\n\n\n\u003cp\u003eCarruseles touch-optimizados. Swiper es la solución líder para sliders:\u003c/p\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003e\u003cstrong\u003eServer-side rendering\u003c/strong\u003e: compatible con Next.js\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eMobile-first\u003c/strong\u003e: diseñado para dispositivos táctiles\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eHardware accelerated\u003c/strong\u003e: animaciones GPU\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eResponsive\u003c/strong\u003e: breakpoints personalizables\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003cdiv style=\"height:60px\" aria-hidden=\"true\" class=\"wp-block-spacer\"\u003e\u003c/div\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003e\u003cstrong\u003e9. next-intl\u003c/strong\u003e\u003c/h2\u003e\n\n\n\n\u003cp\u003eInternacionalización completa con soporte a WPML. Sistema i18n profesional:\u003c/p\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003e\u003cstrong\u003eLocale auto-detection\u003c/strong\u003e: detección automática del idioma\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eRouting multilingual\u003c/strong\u003e: URLs por idioma\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eTraducciones\u003c/strong\u003e: archivos JSON para cada idioma\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003ePluralización\u003c/strong\u003e: reglas gramaticales complejas\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003cpre class=\"wp-block-code\"\u003e\u003ccode\u003e// Ejemplo de uso\nimport { useTranslations } from 'next-intl';\n\nexport default function Component() {\n  const t = useTranslations('Home');\n  return ;\n}\u003c/code\u003e\u003c/pre\u003e\n\n\n\n\u003cdiv style=\"height:60px\" aria-hidden=\"true\" class=\"wp-block-spacer\"\u003e\u003c/div\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003e\u003cstrong\u003e10. SWR\u003c/strong\u003e\u003c/h2\u003e\n\n\n\n\u003cp\u003eCaching y data fetching. SWR proporciona caching inteligente:\u003c/p\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003e\u003cstrong\u003eOffline support\u003c/strong\u003e: funciona sin conexión\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eRevalidación automática\u003c/strong\u003e: datos siempre actualizados\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eCache First\u003c/strong\u003e: prioridad al cache para velocidad\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eDeduplicación\u003c/strong\u003e: evita peticiones duplicadas\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003cdiv style=\"height:60px\" aria-hidden=\"true\" class=\"wp-block-spacer\"\u003e\u003c/div\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003e\u003cstrong\u003e11. Lucide React\u003c/strong\u003e\u003c/h2\u003e\n\n\n\n\u003cp\u003e\u003cstrong\u003eIconos consistentes y accesibles\u003c/strong\u003e. Lucide ofrece más de 1600 iconos disponibles tanto en los componentes React, por SCSS o por bloque personalidado en WordPress:\u003c/p\u003e\n\n\n\n\u003cfigure class=\"wp-block-image size-full\"\u003e\u003cimg loading=\"lazy\" decoding=\"async\" width=\"904\" height=\"379\" src=\"https://penkode.com/headless/wp-content/uploads/2026/02/image-1.png\" alt=\"\" class=\"wp-image-245\" srcset=\"https://penkode.com/headless/wp-content/uploads/2026/02/image-1.png 904w, https://penkode.com/headless/wp-content/uploads/2026/02/image-1-300x126.png 300w, https://penkode.com/headless/wp-content/uploads/2026/02/image-1-768x322.png 768w\" sizes=\"auto, (max-width: 904px) 100vw, 904px\" /\u003e\u003c/figure\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003e\u003cstrong\u003eSVG nativo\u003c/strong\u003e: escalables y ligeros\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eTree-shaking\u003c/strong\u003e: solo incluye iconos usados\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eTypeScript\u003c/strong\u003e: tipado completo\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003ePersonalizable\u003c/strong\u003e: tamaño, stroke, color\u003c/li\u003e\n\u003c/ul\u003e\n\n\n\n\u003cdiv style=\"height:60px\" aria-hidden=\"true\" class=\"wp-block-spacer\"\u003e\u003c/div\u003e\n\n\n\n\u003ch2 class=\"wp-block-heading\"\u003e\u003cstrong\u003e12. Herramientas de Desarrollo\u003c/strong\u003e\u003c/h2\u003e\n\n\n\n\u003cul class=\"wp-block-list\"\u003e\n\u003cli\u003e\u003cstrong\u003eESLint + Prettier\u003c/strong\u003e: Análisis y formateo de código\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eJest\u003c/strong\u003e: Testing unitario\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003eAxios\u003c/strong\u003e: Cliente HTTP\u003c/li\u003e\n\n\n\n\u003cli\u003e\u003cstrong\u003ehtml-react-parser\u003c/strong\u003
